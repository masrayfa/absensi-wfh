<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1480 800" font-family="'JetBrains Mono','SF Mono','Cascadia Code',monospace">
  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600;700&amp;display=swap');
      text { font-family: 'JetBrains Mono','SF Mono','Cascadia Code',monospace; }
    </style>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#1e293b" stroke-width="0.5"/>
    </pattern>
    <marker id="arrow" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto"><polygon points="0 0, 10 3.5, 0 7" fill="#94a3b8"/></marker>
    <marker id="arrow-cyan" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto"><polygon points="0 0, 10 3.5, 0 7" fill="#22d3ee"/></marker>
    <marker id="arrow-emerald" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto"><polygon points="0 0, 10 3.5, 0 7" fill="#34d399"/></marker>
    <marker id="arrow-violet" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto"><polygon points="0 0, 10 3.5, 0 7" fill="#a78bfa"/></marker>
  </defs>

  <rect width="1480" height="800" fill="#0f172a"/>
  <rect width="1480" height="800" fill="url(#grid)"/>

  <!-- Title -->
  <text x="40" y="45" fill="#ffffff" font-size="20" font-weight="700">Check-in flow — multipart photo, EMPLOYEE role</text>
  <text x="40" y="66" fill="#94a3b8" font-size="10">WIB business day · photo required · same-day check-in is idempotent</text>

  <!-- Lifelines -->
  <g stroke="#334155" stroke-width="1" stroke-dasharray="5,5">
    <line x1="140" y1="158" x2="140" y2="700"/>
    <line x1="330" y1="158" x2="330" y2="700"/>
    <line x1="560" y1="158" x2="560" y2="700"/>
    <line x1="820" y1="158" x2="820" y2="700"/>
    <line x1="1080" y1="158" x2="1080" y2="700"/>
    <line x1="1330" y1="158" x2="1330" y2="700"/>
  </g>

  <!-- Actor headers -->
  <g stroke-width="1.5">
    <rect x="50" y="96" width="180" height="62" rx="8" fill="#0f172a"/>
    <rect x="50" y="96" width="180" height="62" rx="8" fill="rgba(8,51,68,0.4)" stroke="#22d3ee"/>
    <text x="140" y="123" fill="#ffffff" font-size="11" font-weight="600" text-anchor="middle">Employee</text>
    <text x="140" y="141" fill="#94a3b8" font-size="8" text-anchor="middle">browser</text>

    <rect x="240" y="96" width="180" height="62" rx="8" fill="#0f172a"/>
    <rect x="240" y="96" width="180" height="62" rx="8" fill="rgba(8,51,68,0.4)" stroke="#22d3ee"/>
    <text x="330" y="123" fill="#ffffff" font-size="11" font-weight="600" text-anchor="middle">web SPA</text>
    <text x="330" y="141" fill="#94a3b8" font-size="8" text-anchor="middle">React :5173</text>

    <rect x="460" y="96" width="200" height="62" rx="8" fill="#0f172a"/>
    <rect x="460" y="96" width="200" height="62" rx="8" fill="rgba(6,78,59,0.4)" stroke="#34d399"/>
    <text x="560" y="123" fill="#ffffff" font-size="11" font-weight="600" text-anchor="middle">api-gateway</text>
    <text x="560" y="141" fill="#94a3b8" font-size="8" text-anchor="middle">HTTP :3000</text>

    <rect x="720" y="96" width="200" height="62" rx="8" fill="#0f172a"/>
    <rect x="720" y="96" width="200" height="62" rx="8" fill="rgba(6,78,59,0.4)" stroke="#34d399"/>
    <text x="820" y="123" fill="#ffffff" font-size="11" font-weight="600" text-anchor="middle">employee-service</text>
    <text x="820" y="141" fill="#94a3b8" font-size="8" text-anchor="middle">TCP :4002</text>

    <rect x="980" y="96" width="200" height="62" rx="8" fill="#0f172a"/>
    <rect x="980" y="96" width="200" height="62" rx="8" fill="rgba(6,78,59,0.4)" stroke="#34d399"/>
    <text x="1080" y="123" fill="#ffffff" font-size="11" font-weight="600" text-anchor="middle">attendance-service</text>
    <text x="1080" y="141" fill="#94a3b8" font-size="8" text-anchor="middle">TCP :4003</text>

    <rect x="1230" y="96" width="200" height="62" rx="8" fill="#0f172a"/>
    <rect x="1230" y="96" width="200" height="62" rx="8" fill="rgba(76,29,149,0.4)" stroke="#a78bfa"/>
    <text x="1330" y="123" fill="#ffffff" font-size="11" font-weight="600" text-anchor="middle">attendance_db</text>
    <text x="1330" y="141" fill="#94a3b8" font-size="8" text-anchor="middle">MySQL 8</text>
  </g>

  <!-- Activation bars -->
  <rect x="326" y="194" width="8" height="500" rx="4" fill="rgba(8,51,68,0.9)" stroke="#22d3ee"/>
  <rect x="556" y="236" width="8" height="392" rx="4" fill="rgba(6,78,59,0.9)" stroke="#34d399"/>
  <rect x="816" y="366" width="8" height="54" rx="4" fill="rgba(6,78,59,0.9)" stroke="#34d399"/>
  <rect x="1076" y="484" width="8" height="112" rx="4" fill="rgba(6,78,59,0.9)" stroke="#34d399"/>
  <rect x="1326" y="530" width="8" height="32" rx="4" fill="rgba(76,29,149,0.9)" stroke="#a78bfa"/>

  <!-- 1 submit -->
  <line x1="140" y1="200" x2="326" y2="200" stroke="#22d3ee" stroke-width="1.5" marker-end="url(#arrow-cyan)"/>
  <text x="233" y="193" fill="#cbd5e1" font-size="8" text-anchor="middle">1 · submit check-in (photo)</text>

  <!-- 2 POST -->
  <line x1="334" y1="244" x2="556" y2="244" stroke="#22d3ee" stroke-width="1.5" marker-end="url(#arrow-cyan)"/>
  <text x="445" y="233" fill="#cbd5e1" font-size="8" text-anchor="middle">2 · POST /attendance/check-in</text>
  <text x="445" y="255" fill="#64748b" font-size="7.5" text-anchor="middle">multipart photo + Bearer JWT</text>

  <!-- gateway self notes -->
  <rect x="576" y="272" width="232" height="42" rx="6" fill="rgba(251,146,60,0.25)" stroke="#fb923c"/>
  <text x="588" y="288" fill="#fed7aa" font-size="7.5">3 · FileInterceptor: save photo →</text>
  <text x="588" y="301" fill="#fed7aa" font-size="7.5">/uploads/&lt;uuid&gt;.&lt;ext&gt; · ≤5MB · raster only</text>
  <text x="588" y="311" fill="#fdba74" font-size="7">missing photo → 400 "photo is required"</text>

  <rect x="576" y="320" width="232" height="34" rx="6" fill="rgba(136,19,55,0.35)" stroke="#fb7185"/>
  <text x="588" y="336" fill="#fecdd3" font-size="7.5">4 · JwtAuthGuard ✓ token</text>
  <text x="588" y="349" fill="#fecdd3" font-size="7.5">RolesGuard ✓ EMPLOYEE</text>

  <!-- 5/6 employee lookup -->
  <line x1="564" y1="374" x2="816" y2="374" stroke="#34d399" stroke-width="1.5" marker-end="url(#arrow-emerald)"/>
  <text x="690" y="367" fill="#cbd5e1" font-size="8" text-anchor="middle">5 · EMPLOYEE_GET_BY_EMAIL { email }</text>
  <line x1="816" y1="414" x2="564" y2="414" stroke="#94a3b8" stroke-width="1.2" stroke-dasharray="5,3" marker-end="url(#arrow)"/>
  <text x="690" y="407" fill="#94a3b8" font-size="8" text-anchor="middle">6 · employee record</text>

  <rect x="576" y="442" width="232" height="26" rx="6" fill="rgba(136,19,55,0.35)" stroke="#fb7185"/>
  <text x="588" y="459" fill="#fecdd3" font-size="7.5">7 · status !== ACTIVE → 403</text>

  <!-- 8 command -->
  <line x1="564" y1="490" x2="1076" y2="490" stroke="#34d399" stroke-width="1.5" marker-end="url(#arrow-emerald)"/>
  <text x="820" y="483" fill="#cbd5e1" font-size="8" text-anchor="middle">8 · ATTENDANCE_CHECK_IN { id, name, userId, photoUrl }</text>

  <!-- 9 insert -->
  <line x1="1084" y1="534" x2="1326" y2="534" stroke="#a78bfa" stroke-width="1.5" marker-end="url(#arrow-violet)"/>
  <text x="1205" y="527" fill="#cbd5e1" font-size="8" text-anchor="middle">9 · INSERT date=WIB today</text>

  <!-- 10 idempotent -->
  <line x1="1326" y1="574" x2="1084" y2="574" stroke="#94a3b8" stroke-width="1.2" stroke-dasharray="5,3" marker-end="url(#arrow)"/>
  <text x="1205" y="567" fill="#94a3b8" font-size="7.5" text-anchor="middle">10 · row · P2002 → existing</text>

  <!-- 11 record -->
  <line x1="1076" y1="616" x2="564" y2="616" stroke="#94a3b8" stroke-width="1.2" stroke-dasharray="5,3" marker-end="url(#arrow)"/>
  <text x="820" y="609" fill="#94a3b8" font-size="8" text-anchor="middle">11 · AttendanceRecord</text>

  <!-- 12/13 response -->
  <line x1="556" y1="652" x2="334" y2="652" stroke="#94a3b8" stroke-width="1.2" stroke-dasharray="5,3" marker-end="url(#arrow)"/>
  <text x="445" y="645" fill="#94a3b8" font-size="8" text-anchor="middle">12 · HTTP 201 Created</text>
  <line x1="326" y1="688" x2="144" y2="688" stroke="#94a3b8" stroke-width="1.2" stroke-dasharray="5,3" marker-end="url(#arrow)"/>
  <text x="233" y="681" fill="#94a3b8" font-size="8" text-anchor="middle">13 · render success · WIB time</text>

  <!-- Legend -->
  <line x1="40" y1="742" x2="80" y2="742" stroke="#34d399" stroke-width="1.5" marker-end="url(#arrow-emerald)"/>
  <text x="90" y="745" fill="#cbd5e1" font-size="8.5">request / command</text>
  <line x1="240" y1="742" x2="280" y2="742" stroke="#94a3b8" stroke-width="1.2" stroke-dasharray="5,3" marker-end="url(#arrow)"/>
  <text x="290" y="745" fill="#cbd5e1" font-size="8.5">response</text>
  <text x="420" y="745" fill="#64748b" font-size="8.5">photo is written by the gateway; the attendance row only stores its public path /uploads/&lt;uuid&gt;.&lt;ext&gt;</text>
</svg>
