<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 880" font-family="'JetBrains Mono','SF Mono','Cascadia Code',monospace">
  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600;700&amp;display=swap');
      text { font-family: 'JetBrains Mono','SF Mono','Cascadia Code',monospace; }
    </style>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#1e293b" stroke-width="0.5"/>
    </pattern>
    <marker id="arrow-cyan" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto"><polygon points="0 0, 10 3.5, 0 7" fill="#22d3ee"/></marker>
    <marker id="arrow-emerald" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto"><polygon points="0 0, 10 3.5, 0 7" fill="#34d399"/></marker>
    <marker id="arrow-orange" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto"><polygon points="0 0, 10 3.5, 0 7" fill="#fb923c"/></marker>
    <marker id="arrow-violet" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto"><polygon points="0 0, 10 3.5, 0 7" fill="#a78bfa"/></marker>
  </defs>

  <rect width="1200" height="880" fill="#0f172a"/>
  <rect width="1200" height="880" fill="url(#grid)"/>

  <text x="40" y="48" fill="#ffffff" font-size="21" font-weight="700">Deployment topology — docker compose</text>
  <text x="40" y="70" fill="#94a3b8" font-size="11">6 containers · default bridge network (service-name DNS) · healthchecks gate startup order · 2 named volumes</text>

  <!-- external -->
  <rect x="460" y="90" width="280" height="52" rx="8" fill="#0f172a"/>
  <rect x="460" y="90" width="280" height="52" rx="8" fill="rgba(8,51,68,0.4)" stroke="#22d3ee" stroke-width="1.5"/>
  <text x="600" y="114" fill="#ffffff" font-size="11" font-weight="600" text-anchor="middle">Browser</text>
  <text x="600" y="130" fill="#94a3b8" font-size="8" text-anchor="middle">localhost:5173</text>

  <!-- compose network region -->
  <rect x="60" y="180" width="1080" height="680" rx="12" fill="none" stroke="#fbbf24" stroke-width="1" stroke-dasharray="10,5"/>
  <text x="76" y="202" fill="#fbbf24" font-size="9" font-weight="600">docker compose · default bridge network · services reach each other by name (auth-service, mysql, …)</text>

  <!-- web -->
  <rect x="460" y="230" width="280" height="76" rx="8" fill="#0f172a"/>
  <rect x="460" y="230" width="280" height="76" rx="8" fill="rgba(8,51,68,0.4)" stroke="#22d3ee" stroke-width="1.5"/>
  <text x="600" y="256" fill="#ffffff" font-size="11" font-weight="600" text-anchor="middle">web · nginx :80</text>
  <text x="600" y="274" fill="#7dd3fc" font-size="8" text-anchor="middle">published 5173:80</text>
  <text x="600" y="290" fill="#94a3b8" font-size="8" text-anchor="middle">serves built SPA · VITE_API_URL baked (build arg)</text>

  <!-- gateway -->
  <rect x="460" y="360" width="280" height="84" rx="8" fill="#0f172a"/>
  <rect x="460" y="360" width="280" height="84" rx="8" fill="rgba(6,78,59,0.4)" stroke="#34d399" stroke-width="1.5"/>
  <text x="600" y="386" fill="#ffffff" font-size="11" font-weight="600" text-anchor="middle">api-gateway :3000</text>
  <text x="600" y="404" fill="#6ee7b7" font-size="8" text-anchor="middle">published 3000 · /docs · /uploads</text>
  <text x="600" y="420" fill="#94a3b8" font-size="8" text-anchor="middle">vol: uploads:/uploads</text>
  <text x="600" y="435" fill="#94a3b8" font-size="8" text-anchor="middle">HC: GET /health</text>

  <!-- services -->
  <g>
    <rect x="90" y="500" width="300" height="96" rx="8" fill="#0f172a"/>
    <rect x="90" y="500" width="300" height="96" rx="8" fill="rgba(6,78,59,0.4)" stroke="#34d399" stroke-width="1.5"/>
    <text x="240" y="526" fill="#ffffff" font-size="11" font-weight="600" text-anchor="middle">auth-service</text>
    <text x="240" y="544" fill="#6ee7b7" font-size="8" text-anchor="middle">TCP :4001 (internal)</text>
    <text x="240" y="562" fill="#94a3b8" font-size="8" text-anchor="middle">HC: TCP connect</text>
    <text x="240" y="578" fill="#94a3b8" font-size="8" text-anchor="middle">depends_on: mysql healthy</text>

    <rect x="450" y="500" width="300" height="96" rx="8" fill="#0f172a"/>
    <rect x="450" y="500" width="300" height="96" rx="8" fill="rgba(6,78,59,0.4)" stroke="#34d399" stroke-width="1.5"/>
    <text x="600" y="526" fill="#ffffff" font-size="11" font-weight="600" text-anchor="middle">employee-service</text>
    <text x="600" y="544" fill="#6ee7b7" font-size="8" text-anchor="middle">TCP :4002 (internal)</text>
    <text x="600" y="562" fill="#94a3b8" font-size="8" text-anchor="middle">HC: TCP connect</text>
    <text x="600" y="578" fill="#94a3b8" font-size="8" text-anchor="middle">depends_on: mysql healthy</text>

    <rect x="810" y="500" width="300" height="96" rx="8" fill="#0f172a"/>
    <rect x="810" y="500" width="300" height="96" rx="8" fill="rgba(6,78,59,0.4)" stroke="#34d399" stroke-width="1.5"/>
    <text x="960" y="526" fill="#ffffff" font-size="11" font-weight="600" text-anchor="middle">attendance-service</text>
    <text x="960" y="544" fill="#6ee7b7" font-size="8" text-anchor="middle">TCP :4003 (internal)</text>
    <text x="960" y="562" fill="#94a3b8" font-size="8" text-anchor="middle">HC: TCP connect</text>
    <text x="960" y="578" fill="#94a3b8" font-size="8" text-anchor="middle">depends_on: mysql healthy</text>
  </g>

  <!-- mysql -->
  <rect x="450" y="670" width="300" height="92" rx="8" fill="#0f172a"/>
  <rect x="450" y="670" width="300" height="92" rx="8" fill="rgba(76,29,149,0.4)" stroke="#a78bfa" stroke-width="1.5"/>
  <text x="600" y="696" fill="#ffffff" font-size="11" font-weight="600" text-anchor="middle">mysql:8 · :3306</text>
  <text x="600" y="714" fill="#c4b5fd" font-size="8" text-anchor="middle">published 3306 · init.sql</text>
  <text x="600" y="731" fill="#94a3b8" font-size="8" text-anchor="middle">vol: mysql_data:/var/lib/mysql</text>
  <text x="600" y="747" fill="#94a3b8" font-size="8" text-anchor="middle">HC: mysqladmin ping</text>

  <!-- volumes -->
  <rect x="280" y="790" width="300" height="52" rx="8" fill="#0f172a"/>
  <rect x="280" y="790" width="300" height="52" rx="8" fill="rgba(251,146,60,0.3)" stroke="#fb923c" stroke-width="1.5"/>
  <text x="430" y="813" fill="#ffffff" font-size="10" font-weight="600" text-anchor="middle">volume mysql_data</text>
  <text x="430" y="830" fill="#94a3b8" font-size="8" text-anchor="middle">/var/lib/mysql</text>

  <rect x="640" y="790" width="300" height="52" rx="8" fill="#0f172a"/>
  <rect x="640" y="790" width="300" height="52" rx="8" fill="rgba(251,146,60,0.3)" stroke="#fb923c" stroke-width="1.5"/>
  <text x="790" y="813" fill="#ffffff" font-size="10" font-weight="600" text-anchor="middle">volume uploads</text>
  <text x="790" y="830" fill="#94a3b8" font-size="8" text-anchor="middle">/uploads (gateway)</text>

  <!-- arrows -->
  <line x1="600" y1="142" x2="600" y2="228" stroke="#22d3ee" stroke-width="1.5" marker-end="url(#arrow-cyan)"/>
  <text x="610" y="188" fill="#64748b" font-size="8">HTTP</text>

  <line x1="600" y1="306" x2="600" y2="358" stroke="#34d399" stroke-width="1.5" marker-end="url(#arrow-emerald)"/>
  <text x="610" y="336" fill="#6ee7b7" font-size="8">depends_on: gateway healthy</text>

  <g stroke="#34d399" stroke-width="1.3" fill="none">
    <path d="M600 444 L240 500" marker-end="url(#arrow-emerald)"/>
    <path d="M600 444 L600 500" marker-end="url(#arrow-emerald)"/>
    <path d="M600 444 L960 500" marker-end="url(#arrow-emerald)"/>
  </g>
  <text x="612" y="472" fill="#6ee7b7" font-size="8">TCP ClientProxy.send(pattern)</text>

  <g stroke="#a78bfa" stroke-width="1.3" fill="none">
    <path d="M240 596 L480 670" marker-end="url(#arrow-violet)"/>
    <path d="M600 596 L600 670" marker-end="url(#arrow-violet)"/>
    <path d="M960 596 L720 670" marker-end="url(#arrow-violet)"/>
  </g>
  <text x="612" y="632" fill="#c4b5fd" font-size="8">Prisma · DATABASE_URL_*</text>

  <line x1="540" y1="762" x2="540" y2="788" stroke="#fb923c" stroke-width="1.3" marker-end="url(#arrow-orange)"/>
  <path d="M740 402 L1120 402 L1120 816 L940 816" fill="none" stroke="#fb923c" stroke-width="1.3" marker-end="url(#arrow-orange)"/>
  <text x="1060" y="392" fill="#fb923c" font-size="7.5" text-anchor="end">UPLOAD_DIR volume</text>

  <text x="76" y="850" fill="#64748b" font-size="8">Startup order: mysql healthy → services healthy → gateway healthy → web · every backend container runs `prisma migrate deploy` + seed at boot.</text>
</svg>
