<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1320 940" font-family="'JetBrains Mono','SF Mono','Cascadia Code',monospace">
  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600;700&amp;display=swap');
      text { font-family: 'JetBrains Mono','SF Mono','Cascadia Code',monospace; }
    </style>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#1e293b" stroke-width="0.5"/>
    </pattern>
    <marker id="arrow" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto"><polygon points="0 0, 10 3.5, 0 7" fill="#64748b"/></marker>
    <marker id="arrow-cyan" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto"><polygon points="0 0, 10 3.5, 0 7" fill="#22d3ee"/></marker>
    <marker id="arrow-rose" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto"><polygon points="0 0, 10 3.5, 0 7" fill="#fb7185"/></marker>
  </defs>

  <rect width="1320" height="940" fill="#0f172a"/>
  <rect width="1320" height="940" fill="url(#grid)"/>

  <text x="40" y="48" fill="#ffffff" font-size="21" font-weight="700">Auth &amp; authorization — issue vs verify</text>
  <text x="40" y="70" fill="#94a3b8" font-size="11">auth-service signs the JWT; the gateway verifies it offline and enforces roles. Roles: EMPLOYEE · HRD</text>

  <!-- regions -->
  <rect x="60" y="100" width="560" height="600" rx="12" fill="none" stroke="#34d399" stroke-width="1" stroke-dasharray="8,4"/>
  <text x="76" y="122" fill="#6ee7b7" font-size="10" font-weight="600">1 · Login — issue token (auth-service)</text>
  <rect x="700" y="100" width="560" height="600" rx="12" fill="none" stroke="#22d3ee" stroke-width="1" stroke-dasharray="8,4"/>
  <text x="716" y="122" fill="#7dd3fc" font-size="10" font-weight="600">2 · Protected request — verify + authorize (gateway)</text>
  <rect x="60" y="730" width="1200" height="180" rx="12" fill="none" stroke="#fb7185" stroke-width="1" stroke-dasharray="4,4"/>
  <text x="76" y="752" fill="#fda4af" font-size="10" font-weight="600">3 · Deactivation cascade (HRD)</text>

  <!-- ===== column 1 ===== -->
  <g text-anchor="middle">
    <rect x="120" y="140" width="440" height="42" rx="21" fill="rgba(8,51,68,0.4)" stroke="#22d3ee"/><text x="340" y="166" fill="#ffffff" font-size="10">POST /auth/login · @Public</text>
    <rect x="120" y="215" width="440" height="42" rx="8" fill="rgba(6,78,59,0.4)" stroke="#34d399"/><text x="340" y="241" fill="#ffffff" font-size="10">auth-service → findByEmail(email)</text>

    <polygon points="340,268 470,310 340,352 210,310" fill="rgba(120,53,15,0.3)" stroke="#fbbf24"/><text x="340" y="314" fill="#ffffff" font-size="9.5">user exists &amp; isActive?</text>
    <rect x="490" y="288" width="120" height="44" rx="6" fill="rgba(136,19,55,0.4)" stroke="#fb7185"/><text x="550" y="307" fill="#fecdd3" font-size="8">401</text><text x="550" y="320" fill="#fecdd3" font-size="7.5">uniform msg</text>

    <rect x="120" y="400" width="440" height="42" rx="8" fill="rgba(6,78,59,0.4)" stroke="#34d399"/><text x="340" y="426" fill="#ffffff" font-size="10">bcrypt.compare(password, hash) · cost 12</text>

    <polygon points="340,443 470,485 340,527 210,485" fill="rgba(120,53,15,0.3)" stroke="#fbbf24"/><text x="340" y="489" fill="#ffffff" font-size="9.5">password match?</text>
    <rect x="490" y="463" width="120" height="44" rx="6" fill="rgba(136,19,55,0.4)" stroke="#fb7185"/><text x="550" y="482" fill="#fecdd3" font-size="8">401</text><text x="550" y="495" fill="#fecdd3" font-size="7.5">same msg</text>

    <rect x="120" y="575" width="440" height="42" rx="8" fill="rgba(6,78,59,0.4)" stroke="#34d399"/><text x="340" y="601" fill="#ffffff" font-size="10">jwt.sign({ sub, email, role }) · expires 8h</text>
    <rect x="120" y="645" width="440" height="42" rx="8" fill="rgba(8,51,68,0.4)" stroke="#22d3ee"/><text x="340" y="671" fill="#ffffff" font-size="10">web stores session → localStorage</text>
  </g>
  <!-- column 1 arrows -->
  <g stroke="#64748b" stroke-width="1.3" marker-end="url(#arrow)" fill="none">
    <line x1="340" y1="182" x2="340" y2="213"/>
    <line x1="340" y1="257" x2="340" y2="268"/>
    <line x1="340" y1="352" x2="340" y2="398"/>
    <line x1="340" y1="442" x2="340" y2="443"/>
    <line x1="340" y1="527" x2="340" y2="573"/>
    <line x1="340" y1="617" x2="340" y2="643"/>
  </g>
  <line x1="470" y1="310" x2="488" y2="310" stroke="#fb7185" stroke-width="1.3" marker-end="url(#arrow-rose)"/>
  <text x="479" y="303" fill="#fb7185" font-size="7" text-anchor="middle">No</text>
  <line x1="470" y1="485" x2="488" y2="485" stroke="#fb7185" stroke-width="1.3" marker-end="url(#arrow-rose)"/>
  <text x="479" y="478" fill="#fb7185" font-size="7" text-anchor="middle">No</text>
  <text x="352" y="390" fill="#64748b" font-size="7">Yes</text>
  <text x="352" y="560" fill="#64748b" font-size="7">Yes</text>

  <!-- ===== column 2 ===== -->
  <g text-anchor="middle">
    <rect x="740" y="140" width="440" height="42" rx="21" fill="rgba(8,51,68,0.4)" stroke="#22d3ee"/><text x="960" y="166" fill="#ffffff" font-size="10">Authorization: Bearer &lt;jwt&gt;</text>
    <rect x="740" y="215" width="440" height="42" rx="8" fill="rgba(136,19,55,0.35)" stroke="#fb7185"/><text x="960" y="241" fill="#ffffff" font-size="10">JwtAuthGuard.verify(secret = JWT_SECRET) — offline</text>

    <polygon points="960,268 1090,310 960,352 830,310" fill="rgba(120,53,15,0.3)" stroke="#fbbf24"/><text x="960" y="314" fill="#ffffff" font-size="9.5">token valid?</text>
    <rect x="1110" y="288" width="130" height="44" rx="6" fill="rgba(136,19,55,0.4)" stroke="#fb7185"/><text x="1175" y="307" fill="#fecdd3" font-size="8">401</text><text x="1175" y="320" fill="#fecdd3" font-size="7.5">missing / invalid</text>

    <rect x="740" y="400" width="440" height="42" rx="8" fill="rgba(8,51,68,0.4)" stroke="#22d3ee"/><text x="960" y="426" fill="#ffffff" font-size="10">@Public() ? skip · else apply @Roles metadata</text>

    <polygon points="960,443 1090,485 960,527 830,485" fill="rgba(120,53,15,0.3)" stroke="#fbbf24"/><text x="960" y="489" fill="#ffffff" font-size="9.5">user.role allowed?</text>
    <rect x="1110" y="463" width="130" height="44" rx="6" fill="rgba(136,19,55,0.4)" stroke="#fb7185"/><text x="1175" y="482" fill="#fecdd3" font-size="8">403</text><text x="1175" y="495" fill="#fecdd3" font-size="7.5">insufficient role</text>

    <rect x="740" y="575" width="440" height="42" rx="8" fill="rgba(6,78,59,0.4)" stroke="#34d399"/><text x="960" y="601" fill="#ffffff" font-size="10">handler → ClientProxy.send(pattern) → owning service</text>
    <rect x="740" y="645" width="440" height="42" rx="8" fill="rgba(8,51,68,0.4)" stroke="#22d3ee"/><text x="960" y="671" fill="#ffffff" font-size="10">result → HTTP response (filter maps upstream errors)</text>
  </g>
  <g stroke="#64748b" stroke-width="1.3" marker-end="url(#arrow)" fill="none">
    <line x1="960" y1="182" x2="960" y2="213"/>
    <line x1="960" y1="257" x2="960" y2="268"/>
    <line x1="960" y1="352" x2="960" y2="398"/>
    <line x1="960" y1="442" x2="960" y2="443"/>
    <line x1="960" y1="527" x2="960" y2="573"/>
    <line x1="960" y1="617" x2="960" y2="643"/>
  </g>
  <line x1="1090" y1="310" x2="1108" y2="310" stroke="#fb7185" stroke-width="1.3" marker-end="url(#arrow-rose)"/>
  <text x="1099" y="303" fill="#fb7185" font-size="7" text-anchor="middle">No</text>
  <line x1="1090" y1="485" x2="1108" y2="485" stroke="#fb7185" stroke-width="1.3" marker-end="url(#arrow-rose)"/>
  <text x="1099" y="478" fill="#fb7185" font-size="7" text-anchor="middle">No</text>

  <!-- ===== deactivation cascade ===== -->
  <g text-anchor="middle" font-size="8.5">
    <text x="115" y="772" fill="#94a3b8" font-size="7.5" text-anchor="start">auth-first ordering — safe retry (ADR-11)</text>
    <rect x="115" y="782" width="250" height="48" rx="8" fill="rgba(136,19,55,0.3)" stroke="#fb7185"/><text x="240" y="803" fill="#ffffff">PATCH /employees/{id}</text><text x="240" y="818" fill="#fecdd3">/deactivate · @Roles(HRD)</text>
    <rect x="395" y="782" width="250" height="48" rx="8" fill="rgba(6,78,59,0.4)" stroke="#34d399"/><text x="520" y="803" fill="#ffffff">1 · EMPLOYEE_GET_BY_ID</text><text x="520" y="818" fill="#94a3b8">404 if missing</text>
    <rect x="675" y="782" width="250" height="48" rx="8" fill="rgba(6,78,59,0.4)" stroke="#34d399"/><text x="800" y="803" fill="#ffffff">2 · AUTH_DEACTIVATE_USER</text><text x="800" y="818" fill="#94a3b8">isActive = false</text>
    <rect x="955" y="782" width="250" height="48" rx="8" fill="rgba(6,78,59,0.4)" stroke="#34d399"/><text x="1080" y="803" fill="#ffffff">3 · EMPLOYEE_DEACTIVATE</text><text x="1080" y="818" fill="#94a3b8">status = INACTIVE</text>
  </g>
  <g stroke="#64748b" stroke-width="1.2" marker-end="url(#arrow)">
    <line x1="365" y1="806" x2="393" y2="806"/>
    <line x1="645" y1="806" x2="673" y2="806"/>
    <line x1="925" y1="806" x2="953" y2="806"/>
  </g>
  <text x="76" y="862" fill="#cbd5e1" font-size="8">After deactivation: fresh login → 401 · attendance routes → 403 (ACTIVE check) · a still-valid 8h JWT is also 403 on attendance · list hides INACTIVE unless ?status=INACTIVE</text>
  <text x="76" y="880" fill="#64748b" font-size="8">AUTH_VALIDATE exists but the gateway verifies tokens offline in JwtAuthGuard (no per-request round-trip).</text>
</svg>
