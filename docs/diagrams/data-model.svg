<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 950" font-family="'JetBrains Mono','SF Mono','Cascadia Code',monospace">
  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600;700&amp;display=swap');
      text { font-family: 'JetBrains Mono','SF Mono','Cascadia Code',monospace; }
    </style>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#1e293b" stroke-width="0.5"/>
    </pattern>
    <marker id="arrow-cyan" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto"><polygon points="0 0, 10 3.5, 0 7" fill="#22d3ee"/></marker>
    <marker id="arrow-violet" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto"><polygon points="0 0, 10 3.5, 0 7" fill="#a78bfa"/></marker>
  </defs>

  <rect width="1120" height="950" fill="#0f172a"/>
  <rect width="1120" height="950" fill="url(#grid)"/>

  <text x="40" y="48" fill="#ffffff" font-size="21" font-weight="700">Data model — schema-per-service (MySQL 8 · Prisma 6)</text>
  <text x="40" y="70" fill="#94a3b8" font-size="11">Three models · one schema each · no cross-database foreign keys (join by email / id snapshots)</text>

  <!-- ===== auth_db.User ===== -->
  <rect x="140" y="140" width="400" height="228" rx="10" fill="#0f172a"/>
  <rect x="140" y="140" width="400" height="228" rx="10" fill="rgba(76,29,149,0.18)" stroke="#a78bfa" stroke-width="1.5"/>
  <path d="M140 150 a10 10 0 0 1 10 -10 h380 a10 10 0 0 1 10 10 v36 h-400 z" fill="rgba(76,29,149,0.65)" stroke="#a78bfa" stroke-width="1.5"/>
  <text x="340" y="169" fill="#ffffff" font-size="12" font-weight="700" text-anchor="middle">auth_db · User</text>
  <g font-size="9">
    <text x="156" y="203" fill="#e2e8f0">id</text><text x="300" y="203" fill="#94a3b8">String @id</text><text x="524" y="203" fill="#c4b5fd" font-size="7" text-anchor="end">PK</text>
    <text x="156" y="229" fill="#e2e8f0">email</text><text x="300" y="229" fill="#94a3b8">String @unique</text><text x="524" y="229" fill="#c4b5fd" font-size="7" text-anchor="end">UQ</text>
    <text x="156" y="255" fill="#e2e8f0">passwordHash</text><text x="300" y="255" fill="#94a3b8">String</text>
    <text x="156" y="281" fill="#e2e8f0">role</text><text x="300" y="281" fill="#94a3b8">EMPLOYEE | HRD</text>
    <text x="156" y="307" fill="#e2e8f0">isActive</text><text x="300" y="307" fill="#94a3b8">Boolean @default(true)</text>
    <text x="156" y="333" fill="#e2e8f0">createdAt</text><text x="300" y="333" fill="#94a3b8">DateTime</text>
    <text x="156" y="359" fill="#e2e8f0">updatedAt</text><text x="300" y="359" fill="#94a3b8">DateTime</text>
  </g>
  <g stroke="#34206b" stroke-width="0.5">
    <line x1="140" y1="212" x2="540" y2="212"/><line x1="140" y1="238" x2="540" y2="238"/>
    <line x1="140" y1="264" x2="540" y2="264"/><line x1="140" y1="290" x2="540" y2="290"/>
    <line x1="140" y1="316" x2="540" y2="316"/><line x1="140" y1="342" x2="540" y2="342"/>
  </g>

  <!-- ===== employee_db.Employee ===== -->
  <rect x="640" y="140" width="420" height="332" rx="10" fill="#0f172a"/>
  <rect x="640" y="140" width="420" height="332" rx="10" fill="rgba(76,29,149,0.18)" stroke="#a78bfa" stroke-width="1.5"/>
  <path d="M640 150 a10 10 0 0 1 10 -10 h400 a10 10 0 0 1 10 10 v36 h-420 z" fill="rgba(76,29,149,0.65)" stroke="#a78bfa" stroke-width="1.5"/>
  <text x="850" y="169" fill="#ffffff" font-size="12" font-weight="700" text-anchor="middle">employee_db · Employee</text>
  <g font-size="9">
    <text x="656" y="203" fill="#e2e8f0">id</text><text x="816" y="203" fill="#94a3b8">String @id</text><text x="1044" y="203" fill="#c4b5fd" font-size="7" text-anchor="end">PK</text>
    <text x="656" y="229" fill="#e2e8f0">employeeNo</text><text x="816" y="229" fill="#94a3b8">String @unique</text><text x="1044" y="229" fill="#c4b5fd" font-size="7" text-anchor="end">UQ</text>
    <text x="656" y="255" fill="#e2e8f0">fullName</text><text x="816" y="255" fill="#94a3b8">String</text>
    <text x="656" y="281" fill="#22d3ee">email</text><text x="816" y="281" fill="#94a3b8">String @unique</text><text x="1044" y="281" fill="#c4b5fd" font-size="7" text-anchor="end">UQ · join</text>
    <text x="656" y="307" fill="#e2e8f0">department</text><text x="816" y="307" fill="#94a3b8">String</text>
    <text x="656" y="333" fill="#e2e8f0">position</text><text x="816" y="333" fill="#94a3b8">String</text>
    <text x="656" y="359" fill="#e2e8f0">phone</text><text x="816" y="359" fill="#94a3b8">String?</text>
    <text x="656" y="385" fill="#e2e8f0">joinDate</text><text x="816" y="385" fill="#94a3b8">DateTime @db.Date</text>
    <text x="656" y="411" fill="#e2e8f0">status</text><text x="816" y="411" fill="#94a3b8">ACTIVE | INACTIVE</text>
    <text x="656" y="437" fill="#e2e8f0">createdAt</text><text x="816" y="437" fill="#94a3b8">DateTime</text>
    <text x="656" y="463" fill="#e2e8f0">updatedAt</text><text x="816" y="463" fill="#94a3b8">DateTime</text>
  </g>
  <g stroke="#34206b" stroke-width="0.5">
    <line x1="640" y1="212" x2="1060" y2="212"/><line x1="640" y1="238" x2="1060" y2="238"/>
    <line x1="640" y1="264" x2="1060" y2="264"/><line x1="640" y1="290" x2="1060" y2="290"/>
    <line x1="640" y1="316" x2="1060" y2="316"/><line x1="640" y1="342" x2="1060" y2="342"/>
    <line x1="640" y1="368" x2="1060" y2="368"/><line x1="640" y1="394" x2="1060" y2="394"/>
    <line x1="640" y1="420" x2="1060" y2="420"/><line x1="640" y1="446" x2="1060" y2="446"/>
  </g>

  <!-- ===== attendance_db.Attendance ===== -->
  <rect x="380" y="560" width="440" height="332" rx="10" fill="#0f172a"/>
  <rect x="380" y="560" width="440" height="332" rx="10" fill="rgba(76,29,149,0.18)" stroke="#a78bfa" stroke-width="1.5"/>
  <path d="M380 570 a10 10 0 0 1 10 -10 h420 a10 10 0 0 1 10 10 v36 h-440 z" fill="rgba(76,29,149,0.65)" stroke="#a78bfa" stroke-width="1.5"/>
  <text x="600" y="589" fill="#ffffff" font-size="12" font-weight="700" text-anchor="middle">attendance_db · Attendance</text>
  <g font-size="9">
    <text x="396" y="623" fill="#e2e8f0">id</text><text x="556" y="623" fill="#94a3b8">String @id</text><text x="804" y="623" fill="#c4b5fd" font-size="7" text-anchor="end">PK</text>
    <text x="396" y="649" fill="#a78bfa">employeeId</text><text x="556" y="649" fill="#94a3b8">String</text><text x="804" y="649" fill="#c4b5fd" font-size="7" text-anchor="end">UQ*</text>
    <text x="396" y="675" fill="#94a3b8">employeeName</text><text x="556" y="675" fill="#94a3b8">String · snapshot</text>
    <text x="396" y="701" fill="#a78bfa">userId</text><text x="556" y="701" fill="#94a3b8">String · snapshot</text>
    <text x="396" y="727" fill="#e2e8f0">date</text><text x="556" y="727" fill="#94a3b8">@db.Date · WIB</text><text x="804" y="727" fill="#c4b5fd" font-size="7" text-anchor="end">UQ*</text>
    <text x="396" y="753" fill="#e2e8f0">checkInAt</text><text x="556" y="753" fill="#94a3b8">DateTime (UTC)</text>
    <text x="396" y="779" fill="#e2e8f0">checkOutAt</text><text x="556" y="779" fill="#94a3b8">DateTime? (null = open)</text>
    <text x="396" y="805" fill="#e2e8f0">photoUrl</text><text x="556" y="805" fill="#94a3b8">"/uploads/&lt;uuid&gt;.&lt;ext&gt;"</text>
    <text x="396" y="831" fill="#e2e8f0">note</text><text x="556" y="831" fill="#94a3b8">String?</text>
    <text x="396" y="857" fill="#e2e8f0">createdAt</text><text x="556" y="857" fill="#94a3b8">DateTime</text>
    <text x="396" y="883" fill="#e2e8f0">updatedAt</text><text x="556" y="883" fill="#94a3b8">DateTime</text>
  </g>
  <g stroke="#34206b" stroke-width="0.5">
    <line x1="380" y1="632" x2="820" y2="632"/><line x1="380" y1="658" x2="820" y2="658"/>
    <line x1="380" y1="684" x2="820" y2="684"/><line x1="380" y1="710" x2="820" y2="710"/>
    <line x1="380" y1="736" x2="820" y2="736"/><line x1="380" y1="762" x2="820" y2="762"/>
    <line x1="380" y1="788" x2="820" y2="788"/><line x1="380" y1="814" x2="820" y2="814"/>
    <line x1="380" y1="840" x2="820" y2="840"/><line x1="380" y1="866" x2="820" y2="866"/>
  </g>

  <!-- ===== links ===== -->
  <path d="M540 225 L590 225 L590 277 L636 277" fill="none" stroke="#22d3ee" stroke-width="1.4" stroke-dasharray="5,3" marker-end="url(#arrow-cyan)"/>
  <text x="590" y="214" fill="#22d3ee" font-size="7.5" text-anchor="middle">email · join key</text>

  <path d="M340 368 L340 697 L376 697" fill="none" stroke="#a78bfa" stroke-width="1.4" stroke-dasharray="5,3" marker-end="url(#arrow-violet)"/>
  <text x="332" y="690" fill="#a78bfa" font-size="7.5" text-anchor="end">userId (snapshot)</text>

  <path d="M850 472 L850 645 L824 645" fill="none" stroke="#a78bfa" stroke-width="1.4" stroke-dasharray="5,3" marker-end="url(#arrow-violet)"/>
  <text x="860" y="645" fill="#a78bfa" font-size="7.5">employeeId (snapshot)</text>

  <text x="140" y="930" fill="#64748b" font-size="8">* Unique(employeeId, date) — same-day check-in idempotency · User ⟷ Employee join by email · Attendance stores id/name/userId snapshots (no cross-DB FK)</text>
</svg>
