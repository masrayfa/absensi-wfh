<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1560 1090" font-family="'JetBrains Mono','SF Mono','Cascadia Code',monospace">
  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600;700&amp;display=swap');
      text { font-family: 'JetBrains Mono','SF Mono','Cascadia Code',monospace; }
    </style>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#1e293b" stroke-width="0.5"/>
    </pattern>
    <marker id="arrow" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto"><polygon points="0 0, 10 3.5, 0 7" fill="#64748b"/></marker>
    <marker id="arrow-cyan" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto"><polygon points="0 0, 10 3.5, 0 7" fill="#22d3ee"/></marker>
    <marker id="arrow-emerald" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto"><polygon points="0 0, 10 3.5, 0 7" fill="#34d399"/></marker>
    <marker id="arrow-orange" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto"><polygon points="0 0, 10 3.5, 0 7" fill="#fb923c"/></marker>
    <marker id="arrow-violet" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto"><polygon points="0 0, 10 3.5, 0 7" fill="#a78bfa"/></marker>
  </defs>

  <rect width="1560" height="1090" fill="#0f172a"/>
  <rect width="1560" height="1090" fill="url(#grid)"/>

  <!-- Title block -->
  <text x="60" y="52" fill="#ffffff" font-size="22" font-weight="700">Absensi WFH Karyawan — System Architecture</text>
  <text x="60" y="74" fill="#94a3b8" font-size="11">NestJS microservices + React SPA · MySQL · TCP contract-first · Dexa Group fullstack take-home</text>

  <!-- Legend -->
  <rect x="1160" y="90" width="360" height="160" rx="10" fill="rgba(30,41,59,0.5)" stroke="#334155" stroke-width="1"/>
  <text x="1176" y="112" fill="#e2e8f0" font-size="11" font-weight="600">Legend</text>
  <rect x="1176" y="123" width="12" height="12" rx="2" fill="rgba(8,51,68,0.4)" stroke="#22d3ee"/>
  <text x="1198" y="134" fill="#cbd5e1" font-size="9">Client / web SPA</text>
  <rect x="1176" y="147" width="12" height="12" rx="2" fill="rgba(6,78,59,0.4)" stroke="#34d399"/>
  <text x="1198" y="158" fill="#cbd5e1" font-size="9">NestJS service (bounded context)</text>
  <rect x="1176" y="171" width="12" height="12" rx="2" fill="rgba(76,29,149,0.4)" stroke="#a78bfa"/>
  <text x="1198" y="182" fill="#cbd5e1" font-size="9">Database schema (one per service)</text>
  <rect x="1176" y="195" width="12" height="12" rx="2" fill="rgba(251,146,60,0.3)" stroke="#fb923c"/>
  <text x="1198" y="206" fill="#cbd5e1" font-size="9">TCP transport / file store</text>
  <rect x="1176" y="219" width="12" height="12" rx="2" fill="rgba(136,19,55,0.4)" stroke="#fb7185"/>
  <text x="1198" y="230" fill="#cbd5e1" font-size="9">AuthN / AuthZ guard</text>

  <!-- ================= CLIENTS ================= -->
  <rect x="440" y="100" width="300" height="66" rx="8" fill="#0f172a"/>
  <rect x="440" y="100" width="300" height="66" rx="8" fill="rgba(8,51,68,0.4)" stroke="#22d3ee" stroke-width="1.5"/>
  <text x="590" y="128" fill="#ffffff" font-size="12" font-weight="600" text-anchor="middle">Karyawan · EMPLOYEE</text>
  <text x="590" y="148" fill="#94a3b8" font-size="9" text-anchor="middle">browser — check-in + own history</text>

  <rect x="820" y="100" width="300" height="66" rx="8" fill="#0f172a"/>
  <rect x="820" y="100" width="300" height="66" rx="8" fill="rgba(8,51,68,0.4)" stroke="#22d3ee" stroke-width="1.5"/>
  <text x="970" y="128" fill="#ffffff" font-size="12" font-weight="600" text-anchor="middle">HRD · ADMIN</text>
  <text x="970" y="148" fill="#94a3b8" font-size="9" text-anchor="middle">browser — master karyawan + monitoring</text>

  <line x1="590" y1="166" x2="590" y2="216" stroke="#22d3ee" stroke-width="1.5" marker-end="url(#arrow-cyan)"/>
  <line x1="970" y1="166" x2="970" y2="216" stroke="#22d3ee" stroke-width="1.5" marker-end="url(#arrow-cyan)"/>
  <text x="780" y="198" fill="#64748b" font-size="8" text-anchor="middle">browser ⇄ SPA</text>

  <!-- ================= WEB SPA ================= -->
  <rect x="440" y="220" width="680" height="82" rx="8" fill="#0f172a"/>
  <rect x="440" y="220" width="680" height="82" rx="8" fill="rgba(8,51,68,0.4)" stroke="#22d3ee" stroke-width="1.5"/>
  <text x="780" y="250" fill="#ffffff" font-size="13" font-weight="700" text-anchor="middle">web — React SPA · :5173</text>
  <text x="780" y="270" fill="#94a3b8" font-size="9" text-anchor="middle">React 19 · Vite · TypeScript · Tailwind · shadcn/ui</text>
  <text x="780" y="287" fill="#94a3b8" font-size="9" text-anchor="middle">TanStack Query hooks → axios (VITE_API_URL) · session in localStorage</text>

  <line x1="780" y1="302" x2="780" y2="366" stroke="#22d3ee" stroke-width="1.5" marker-end="url(#arrow-cyan)"/>
  <text x="792" y="340" fill="#7dd3fc" font-size="8">JSON + JWT Bearer (8h)</text>

  <!-- ================= API GATEWAY ================= -->
  <rect x="280" y="370" width="1000" height="120" rx="10" fill="#0f172a"/>
  <rect x="280" y="370" width="1000" height="120" rx="10" fill="rgba(6,78,59,0.4)" stroke="#34d399" stroke-width="1.5"/>
  <text x="780" y="398" fill="#ffffff" font-size="14" font-weight="700" text-anchor="middle">api-gateway — HTTP :3000</text>
  <text x="780" y="417" fill="#94a3b8" font-size="9" text-anchor="middle">NestJS HTTP · owns NO database · validates JWT/roles · stores photos · forwards TCP commands · Swagger /docs</text>

  <!-- guard / pipeline pills -->
  <g font-size="8" text-anchor="middle">
    <rect x="304" y="436" width="144" height="24" rx="12" fill="rgba(136,19,55,0.35)" stroke="#fb7185"/><text x="376" y="451" fill="#fecdd3">JwtAuthGuard</text>
    <rect x="460" y="436" width="144" height="24" rx="12" fill="rgba(136,19,55,0.35)" stroke="#fb7185"/><text x="532" y="451" fill="#fecdd3">RolesGuard</text>
    <rect x="616" y="436" width="144" height="24" rx="12" fill="rgba(6,78,59,0.5)" stroke="#34d399"/><text x="688" y="451" fill="#a7f3d0">ValidationPipe</text>
    <rect x="772" y="436" width="144" height="24" rx="12" fill="rgba(6,78,59,0.5)" stroke="#34d399"/><text x="844" y="451" fill="#a7f3d0">ExceptionFilter</text>
    <rect x="928" y="436" width="144" height="24" rx="12" fill="rgba(6,78,59,0.5)" stroke="#34d399"/><text x="1000" y="451" fill="#a7f3d0">Swagger /docs</text>
    <rect x="1084" y="436" width="144" height="24" rx="12" fill="rgba(251,146,60,0.25)" stroke="#fb923c"/><text x="1156" y="451" fill="#fed7aa">ServeStatic /uploads</text>
  </g>

  <!-- Photo store -->
  <rect x="1330" y="390" width="180" height="82" rx="8" fill="#0f172a"/>
  <rect x="1330" y="390" width="180" height="82" rx="8" fill="rgba(251,146,60,0.3)" stroke="#fb923c" stroke-width="1.5"/>
  <text x="1420" y="418" fill="#ffffff" font-size="11" font-weight="600" text-anchor="middle">Photo store</text>
  <text x="1420" y="436" fill="#94a3b8" font-size="8" text-anchor="middle">UPLOAD_DIR · served /uploads</text>
  <text x="1420" y="451" fill="#94a3b8" font-size="8" text-anchor="middle">/uploads/&lt;uuid&gt;.&lt;ext&gt;</text>
  <line x1="1280" y1="430" x2="1326" y2="430" stroke="#fb923c" stroke-width="1.5" marker-end="url(#arrow-orange)"/>
  <text x="1303" y="422" fill="#fb923c" font-size="7" text-anchor="middle">file</text>

  <!-- ================= TCP BUS ================= -->
  <rect x="150" y="525" width="1260" height="14" rx="7" fill="rgba(251,146,60,0.3)" stroke="#fb923c" stroke-width="1"/>
  <text x="780" y="517" fill="#fb923c" font-size="9" font-weight="600" text-anchor="middle">TCP transport — @nestjs/microservices ClientProxy.send(pattern) · contract-first, no broker, fails fast</text>

  <line x1="330" y1="490" x2="330" y2="524" stroke="#fb923c" stroke-width="1.2"/>
  <line x1="780" y1="490" x2="780" y2="524" stroke="#fb923c" stroke-width="1.2"/>
  <line x1="1230" y1="490" x2="1230" y2="524" stroke="#fb923c" stroke-width="1.2"/>
  <line x1="330" y1="539" x2="330" y2="562" stroke="#fb923c" stroke-width="1.2" marker-end="url(#arrow-orange)"/>
  <line x1="780" y1="539" x2="780" y2="562" stroke="#fb923c" stroke-width="1.2" marker-end="url(#arrow-orange)"/>
  <line x1="1230" y1="539" x2="1230" y2="562" stroke="#fb923c" stroke-width="1.2" marker-end="url(#arrow-orange)"/>

  <!-- ================= MICROSERVICES ================= -->
  <rect x="150" y="565" width="360" height="118" rx="8" fill="#0f172a"/>
  <rect x="150" y="565" width="360" height="118" rx="8" fill="rgba(6,78,59,0.4)" stroke="#34d399" stroke-width="1.5"/>
  <text x="330" y="592" fill="#ffffff" font-size="12" font-weight="700" text-anchor="middle">auth-service · TCP :4001</text>
  <text x="330" y="610" fill="#6ee7b7" font-size="9" text-anchor="middle">domain: Identity &amp; Access</text>
  <text x="170" y="632" fill="#94a3b8" font-size="8">• User(email, passwordHash, role, isActive)</text>
  <text x="170" y="648" fill="#94a3b8" font-size="8">• bcrypt cost 12 · JWT issue / validate</text>
  <text x="170" y="664" fill="#94a3b8" font-size="8">• AUTH_CREATE_USER · AUTH_DEACTIVATE_USER</text>

  <rect x="600" y="565" width="360" height="118" rx="8" fill="#0f172a"/>
  <rect x="600" y="565" width="360" height="118" rx="8" fill="rgba(6,78,59,0.4)" stroke="#34d399" stroke-width="1.5"/>
  <text x="780" y="592" fill="#ffffff" font-size="12" font-weight="700" text-anchor="middle">employee-service · TCP :4002</text>
  <text x="780" y="610" fill="#6ee7b7" font-size="9" text-anchor="middle">domain: Master Karyawan</text>
  <text x="620" y="632" fill="#94a3b8" font-size="8">• Employee CRUD + soft-delete (INACTIVE)</text>
  <text x="620" y="648" fill="#94a3b8" font-size="8">• unique employeeNo &amp; email (join key)</text>
  <text x="620" y="664" fill="#94a3b8" font-size="8">• EMPLOYEE_CREATE/LIST/UPDATE/DEACTIVATE</text>

  <rect x="1050" y="565" width="360" height="118" rx="8" fill="#0f172a"/>
  <rect x="1050" y="565" width="360" height="118" rx="8" fill="rgba(6,78,59,0.4)" stroke="#34d399" stroke-width="1.5"/>
  <text x="1230" y="592" fill="#ffffff" font-size="12" font-weight="700" text-anchor="middle">attendance-service · TCP :4003</text>
  <text x="1230" y="610" fill="#6ee7b7" font-size="9" text-anchor="middle">domain: Attendance &amp; Time</text>
  <text x="1070" y="632" fill="#94a3b8" font-size="8">• check-in (photo required) / check-out</text>
  <text x="1070" y="648" fill="#94a3b8" font-size="8">• WIB business date (Asia/Jakarta, UTC+7)</text>
  <text x="1070" y="664" fill="#94a3b8" font-size="8">• unique (employeeId, date) · idempotent</text>

  <!-- ================= MYSQL ================= -->
  <rect x="280" y="760" width="1000" height="170" rx="12" fill="none" stroke="#a78bfa" stroke-width="1" stroke-dasharray="8,4"/>
  <text x="300" y="784" fill="#a78bfa" font-size="10" font-weight="600">MySQL 8 · :3306</text>

  <!-- connectors services -> schemas -->
  <line x1="330" y1="683" x2="478" y2="798" stroke="#a78bfa" stroke-width="1.2" marker-end="url(#arrow-violet)"/>
  <line x1="780" y1="683" x2="780" y2="798" stroke="#a78bfa" stroke-width="1.2" marker-end="url(#arrow-violet)"/>
  <line x1="1230" y1="683" x2="1082" y2="798" stroke="#a78bfa" stroke-width="1.2" marker-end="url(#arrow-violet)"/>
  <text x="500" y="748" fill="#a78bfa" font-size="8">Prisma Client</text>

  <!-- auth_db cylinder -->
  <g transform="translate(360,800)">
    <rect x="0" y="12" width="240" height="64" rx="2" fill="#0f172a"/>
    <ellipse cx="120" cy="12" rx="120" ry="15" fill="#0f172a"/>
    <ellipse cx="120" cy="76" rx="120" ry="15" fill="#0f172a"/>
    <rect x="0" y="12" width="240" height="64" fill="rgba(76,29,149,0.4)"/>
    <ellipse cx="120" cy="12" rx="120" ry="15" fill="rgba(76,29,149,0.4)" stroke="#a78bfa" stroke-width="1.5"/>
    <ellipse cx="120" cy="76" rx="120" ry="15" fill="rgba(76,29,149,0.4)" stroke="#a78bfa" stroke-width="1.5"/>
    <line x1="0" y1="12" x2="0" y2="76" stroke="#a78bfa" stroke-width="1.5"/>
    <line x1="240" y1="12" x2="240" y2="76" stroke="#a78bfa" stroke-width="1.5"/>
    <text x="120" y="46" fill="#ffffff" font-size="11" font-weight="600" text-anchor="middle">auth_db</text>
    <text x="120" y="63" fill="#94a3b8" font-size="8" text-anchor="middle">User</text>
  </g>
  <!-- employee_db cylinder -->
  <g transform="translate(660,800)">
    <rect x="0" y="12" width="240" height="64" rx="2" fill="#0f172a"/>
    <ellipse cx="120" cy="12" rx="120" ry="15" fill="#0f172a"/>
    <ellipse cx="120" cy="76" rx="120" ry="15" fill="#0f172a"/>
    <rect x="0" y="12" width="240" height="64" fill="rgba(76,29,149,0.4)"/>
    <ellipse cx="120" cy="12" rx="120" ry="15" fill="rgba(76,29,149,0.4)" stroke="#a78bfa" stroke-width="1.5"/>
    <ellipse cx="120" cy="76" rx="120" ry="15" fill="rgba(76,29,149,0.4)" stroke="#a78bfa" stroke-width="1.5"/>
    <line x1="0" y1="12" x2="0" y2="76" stroke="#a78bfa" stroke-width="1.5"/>
    <line x1="240" y1="12" x2="240" y2="76" stroke="#a78bfa" stroke-width="1.5"/>
    <text x="120" y="46" fill="#ffffff" font-size="11" font-weight="600" text-anchor="middle">employee_db</text>
    <text x="120" y="63" fill="#94a3b8" font-size="8" text-anchor="middle">Employee</text>
  </g>
  <!-- attendance_db cylinder -->
  <g transform="translate(960,800)">
    <rect x="0" y="12" width="240" height="64" rx="2" fill="#0f172a"/>
    <ellipse cx="120" cy="12" rx="120" ry="15" fill="#0f172a"/>
    <ellipse cx="120" cy="76" rx="120" ry="15" fill="#0f172a"/>
    <rect x="0" y="12" width="240" height="64" fill="rgba(76,29,149,0.4)"/>
    <ellipse cx="120" cy="12" rx="120" ry="15" fill="rgba(76,29,149,0.4)" stroke="#a78bfa" stroke-width="1.5"/>
    <ellipse cx="120" cy="76" rx="120" ry="15" fill="rgba(76,29,149,0.4)" stroke="#a78bfa" stroke-width="1.5"/>
    <line x1="0" y1="12" x2="0" y2="76" stroke="#a78bfa" stroke-width="1.5"/>
    <line x1="240" y1="12" x2="240" y2="76" stroke="#a78bfa" stroke-width="1.5"/>
    <text x="120" y="46" fill="#ffffff" font-size="11" font-weight="600" text-anchor="middle">attendance_db</text>
    <text x="120" y="63" fill="#94a3b8" font-size="8" text-anchor="middle">Attendance</text>
  </g>
  <text x="300" y="918" fill="#64748b" font-size="8">schema-per-service isolation · services join by id/email, never by cross-database foreign keys</text>

  <!-- ================= SHARED LIBS ================= -->
  <rect x="280" y="950" width="1000" height="112" rx="12" fill="none" stroke="#475569" stroke-width="1" stroke-dasharray="6,4"/>
  <text x="296" y="969" fill="#94a3b8" font-size="8.5">libs/ · shared workspace packages — contract-first, built before the apps (dist gitignored)</text>

  <rect x="300" y="980" width="460" height="64" rx="8" fill="#0f172a"/>
  <rect x="300" y="980" width="460" height="64" rx="8" fill="rgba(59,130,246,0.3)" stroke="#60a5fa" stroke-width="1.5"/>
  <text x="530" y="1006" fill="#ffffff" font-size="11" font-weight="600" text-anchor="middle">@app/contracts</text>
  <text x="530" y="1025" fill="#94a3b8" font-size="8" text-anchor="middle">TCP_PATTERNS · Role/Status enums · DTOs — single source of truth</text>

  <rect x="800" y="980" width="460" height="64" rx="8" fill="#0f172a"/>
  <rect x="800" y="980" width="460" height="64" rx="8" fill="rgba(59,130,246,0.3)" stroke="#60a5fa" stroke-width="1.5"/>
  <text x="1030" y="1006" fill="#ffffff" font-size="11" font-weight="600" text-anchor="middle">@app/common</text>
  <text x="1030" y="1025" fill="#94a3b8" font-size="8" text-anchor="middle">JwtAuthGuard · RolesGuard · decorators · filters · loadConfig · wibDateOf</text>
</svg>
